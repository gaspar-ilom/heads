# Only re-deploy if dependencies are updated here
name: Trigger re-deployment of Heads Wiki 

on:
  # Runs on pushes targeting the default branch and only for the relevant folder and files.
  push:
    branches: ["master", "heads-wiki-actions"]
    paths: ["BOARDS_AND_TESTERS.md"]

  # Allows manual triggers for convenience
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  deploy-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources from main repo
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT_WIKI }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/gaspar-ilom/heads-wiki/dispatches \
          -d '{"event_type":"redeploy-wiki","client_payload":{"ref": "problem-resolution"}}'